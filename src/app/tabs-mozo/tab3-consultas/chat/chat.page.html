<ion-header [translucent]="true" class="chat-header">
  <ion-toolbar>
    <ion-button (click)="volver()" fill="clear" shape="round" slot="end">
      Volver
      <ion-icon slot="start" name="home-outline"></ion-icon>
    </ion-button>
    <ion-title>Chat - Mesa {{ id_mesa }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-content">
  <div class="messages-container">
    <div class="messages-list" #messagesWrapper>
      <div *ngIf="loading()" class="d-flex justify-content-center align-items-center h-100">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando mensajes...</span>
        </div>
      </div>
      
      <div *ngFor="let mensaje of messages(); let i = index; trackBy: trackByIndex" 
           class="message-wrapper" 
           [ngClass]="mensaje.nombre_usuario == username ? 'sent' : 'received'">
        <div class="message-bubble">
          <div class="message-header">
            <strong class="sender-name">
              <span *ngIf="mensaje.nombre_usuario == username; else otherUser">Tú</span>
              <ng-template #otherUser>{{ mensaje.nombre_usuario || 'Anónimo' }}</ng-template>
            </strong>
          </div>
          <div class="message-content">
            {{ mensaje.contenido }}
          </div>
          <div class="message-time">
            {{ mensaje.date_sended | date:'HH:mm' }}
          </div>
        </div>
      </div>

      <div *ngIf="messages().length === 0 && !loading()" class="no-messages">
        <p>No hay mensajes aún.</p>
      </div>
      <div class="input-container">
        <ion-item lines="none" class="input-item">
          <ion-input 
            type="text" 
            placeholder="Escribe un mensaje..." 
            [(ngModel)]="newMessage" 
            class="message-input"
            (keydown.enter)="sendMessage()">
          </ion-input>
          <ion-button 
            (click)="sendMessage()" 
            fill="clear" 
            slot="end" 
            [disabled]="!newMessage.trim()" 
            class="send-button">
            <ion-icon slot="icon-only" name="send-sharp"></ion-icon>
          </ion-button>
        </ion-item>
      </div>
    </div>
  </div>

</ion-content>
