<ion-header class="ion-no-border">
  <ion-toolbar style="--min-height: 44px;">
    <ion-title>Detalle del Pedido - Mesa {{ pedido?.mesa?.numero }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="detalle-scroll">
  <div class="pedido-info">
    <!-- Items del pedido -->
    <ion-card class="card-items">
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="list-outline"></ion-icon>
          Items del Pedido
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let item of items">
            <div class="item-content">
              <div class="item-info">
                <h3>{{ item.nombre_prod }}</h3>
                <p class="item-details">
                  <span class="cantidad">{{ item.cantidad }}x</span>
                  <span class="precio-unitario">${{ item.precio_unitario }}</span>
                  <ion-badge 
                    [color]="item.tipo === 'plato' ? 'secondary' : 'danger'"
                    class="tipo-badge">
                    {{ item.tipo === 'plato' ? 'Cocina' : 'Bar' }}
                  </ion-badge>
                </p>
              </div>
              <div class="item-subtotal">
                <strong>${{ calcularSubtotal(item) }}</strong>
              </div>
            </div>
          </ion-item>
        </ion-list>
        
        <!-- Total -->
        <div class="total-section">
          <ion-item lines="none" class="total-item">
            <ion-label slot="start">
              <h2><strong>Total del Pedido</strong></h2>
            </ion-label>
            <ion-label slot="end">
              <h2><strong>${{ pedido?.total || calcularTotal() }}</strong></h2>
            </ion-label>
          </ion-item>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</div>
