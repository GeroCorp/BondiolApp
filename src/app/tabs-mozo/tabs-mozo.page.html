<ion-tabs>
  <ion-tab-bar slot="bottom">
    
    <ion-tab-button tab="tab1-pedidos-pendientes">
      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Pendientes</ion-label>
      <ion-badge *ngIf="pedidosPendientes > 0" color="warning">{{ pedidosPendientes }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="tab2-pedidos-confirmados">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <ion-label>Confirmados</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3-consultas">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Consultas</ion-label>
      <ion-badge *ngIf="consultasPendientes > 0" color="danger">{{ consultasPendientes }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button (click)="volverHome()">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
