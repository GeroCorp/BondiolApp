<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Carga de productos</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding" [fullscreen]="true">
  <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Carga de productos</ion-title>
      </ion-toolbar>
  </ion-header>

  <ion-card-content class="ion-padding">
    <form [formGroup]="productoForm" (ngSubmit)="crearProducto()">
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input formControlName="nombre"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Descripción</ion-label>
        <ion-input formControlName="descripcion"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Tiempo de elaboración (en minutos)</ion-label>
        <ion-input type="text" inputmode="numeric" formControlName="tiempo"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Precio</ion-label>
        <ion-input type="text" inputmode="numeric" formControlName="precio"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Fotos</ion-label>
        <ion-button expand="block" (click)="tomarFoto()">Subir imágenes</ion-button>
      </ion-item>

      <div *ngIf="imagenes" class="container-img-producto">
        <img *ngFor="let img of imagenes; let i = index"
        [src]="img"
        id="img-producto"/>
      </div>

      <ion-button expand="block" type="submit">
        Crear Producto
      </ion-button>
    </form>
  </ion-card-content>

  <div class="container-cerrar-sesion">
    <ion-button expand="block" (click)="logout()" color="danger">
      Cerrar sesión
    </ion-button>
  </div>

</ion-content>
