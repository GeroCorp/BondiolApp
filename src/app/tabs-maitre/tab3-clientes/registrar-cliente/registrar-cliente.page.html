<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registrar Cliente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="wrapper">
  <div class="">
  <ion-card>
    <ion-card-content class="ion-padding">

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        
          <ion-input type="text" formControlName="name" label="Nombre" fill="outline" labelPlacement="floating" class="ion-margin-top" [value]="trimed ? trimed[2] : ''" />
          <ion-input type="text" formControlName="surname" label="Apellido" fill="outline" labelPlacement="floating" class="ion-margin-top" [value]="trimed ? trimed[1] : ''" />

          <ion-input type="text" formControlName="dni" label="DNI" fill="outline" labelPlacement="floating" class="ion-margin-top" [value]="trimed ? trimed[4] : ''" />

          <ion-input type="email" formControlName="email" label="Correo Electrónico" fill="outline" labelPlacement="floating" class="ion-margin-top"/>
        
          <ion-input type="password" formControlName="password" label="Contraseña" fill="outline" labelPlacement="floating" class="ion-margin-top"/>
          <ion-input type="password" formControlName="password2" label="Repetir Contraseña" fill="outline" labelPlacement="floating" class="ion-margin-top"/>

          
        <ion-label>Foto</ion-label>
        <ion-button expand="block" (click)="tomarFoto()">Tomar Foto</ion-button>
        <div *ngIf="foto" class="container-img-empleado">
          <img [src]="foto" id="img-empleado" width="80px"/>
        </div>
      
        <ion-item>
          <ion-label>QR DNI</ion-label>
          <ion-button expand="block" (click)="leerQR()">Leer QR</ion-button>

          
        </ion-item>
        <div *ngIf="qrData" class="ion-margin-top">
          <p>Datos del QR: {{ qrData }}</p>
        
        </div>
        
        <ion-button expand="block" type="submit" class="ion-margin-top">
          Crear Cuenta<ion-icon name="person-add-outline" slot="end"></ion-icon>
        </ion-button>
      </form>

    </ion-card-content>
  </ion-card>
  </div>

</ion-content>
