<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>tab3-clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">tab3-clientes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Opciones</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-padding">
      <ion-list>

        <ion-item>
          <ion-button  (click)="registrarCliente()">
            Registrar Cliente
            <ion-icon name="person-add-outline" slot="end"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>


</ion-content>
