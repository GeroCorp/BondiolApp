<ion-header [translucent]="true">
  <ion-toolbar class="ion-text-center custom-header">
    <div slot="start" class="header-spacer"></div>
 
    <ion-title class="toolbar-logo-title">
      <img src="assets/icon/icon-only.png" alt="Logo" width="70" />
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="presala-content">
  <ion-card class="presala-container">
    <ion-card-content>
      <div class="icon-container">
        <ion-icon name="hourglass-outline" color="warning"></ion-icon>
      </div>

      <h1>Registro en Revisión</h1>
      
      <div class="message-box">
        <p class="main-message">
          Hola <strong>{{ clienteNombre }}</strong>,
        </p>
        <p>
          Tu solicitud de registro está siendo revisada por nuestro equipo.
        </p>
        <p>
          Recibirás un <strong>correo electrónico</strong> cuando cambie el estado de tu solicitud.
        </p>
      </div>

      <div class="info-box">
        <ion-icon name="mail-outline" color="primary"></ion-icon>
        <p>Te notificaremos a: <strong>{{ clienteEmail }}</strong></p>
      </div>

      <app-main-button
      (btnClick)="volverAlLogin()"
      >
      <ion-icon name="home-outline" slot="start"></ion-icon>
      Ir a Inicio
    </app-main-button>
  </ion-card-content>
  </ion-card>
</ion-content>
