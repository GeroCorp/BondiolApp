<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Ingreso Anónimo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-layout">
    <div class="anon-info-block">
      <div class="anon-info-badge">
        <ion-icon name="person-outline"></ion-icon>
        Ingreso Anónimo
      </div>
      <p class="anon-info-desc">
        Podés ver el menú, hacer pedidos y seguir su estado sin registrarte.
      </p>
      <div class="anon-features">
        <div class="anon-feat ok">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <span>Ver menú y hacer pedidos</span>
        </div>
        <div class="anon-feat ok">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <span>Ver estado de tu pedido</span>
        </div>
        <div class="anon-feat no">
          <ion-icon name="close-circle-outline"></ion-icon>
          <span>Juegos y descuentos</span>
        </div>
        <div class="anon-feat no">
          <ion-icon name="close-circle-outline"></ion-icon>
          <span>Encuestas de satisfacción</span>
        </div>
      </div>
      <button class="anon-register-btn" (click)="irARegistro()">
        <ion-icon name="person-add-outline"></ion-icon>
        Registrarme para acceder a todo
      </button>
    </div>

    <div class="anon-divider"></div>

    <div class="form-block">
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="nombre"></ion-input>
      </ion-item>

      <div class="foto-zone" (click)="tomarFoto()">
        <img
          *ngIf="foto"
          [src]="foto"
          alt="Foto del cliente"
          class="foto-img"
        />
        <div *ngIf="!foto" class="foto-placeholder">
          <ion-icon name="camera-outline"></ion-icon>
          <p>Presioná para tomar una foto</p>
        </div>
        <div *ngIf="foto" class="foto-retake-badge">
          <ion-icon name="camera-outline"></ion-icon>
          Retomar
        </div>
      </div>

      <div class="actions">
        <ion-button
          expand="block"
          (click)="ingresar()"
          [disabled]="!nombre || !foto"
        >
          Ingresar
        </ion-button>
        <ion-button
          expand="block"
          (click)="accederComoExistente()"
          color="secondary"
        >
          <ion-icon name="people-circle-outline" slot="start"></ion-icon>
          Acceder como Cliente Existente
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
