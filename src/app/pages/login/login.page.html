<ion-header [translucent]="true">
  <ion-toolbar class="ion-text-center">
    <img src="assets/icon/icon-only.png" alt="Logo" width="85">
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content ion-padding ion-justify-content-center ion-align-items-center">


  <ion-card class="card-container">
    <ion-card-header>
      <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-padding">

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        
          <!-- Quizá queda mejor y con un estilo mas apegado a movil con el outline y floating
              pero si lo ven medio medio borren el tag de comentario y los "label / fill" de input 
          -->
          <ion-input type="email" formControlName="email" label="Correo Electrónico" fill="outline" labelPlacement="floating" class="ion-margin-top"/>
        
          <ion-input [type]="passwordVisible ? 'text' : 'password'" formControlName="password" label="Contraseña" fill="outline" labelPlacement="floating" class="ion-margin-top"/> 
          <ion-button fill="clear" slot="end" (click)="cambiarVisibilidadPassword()"><ion-icon [name]="passwordVisible ? 'eye' : 'eye-off'"></ion-icon></ion-button>

          <!-- Existe un tag implementado en ionic para mostrar/ocultar password xd -->
          

        <ion-button expand="block" type="submit" class="btn-primary ion-margin-top">
          Iniciar sesión <ion-icon name="log-in-outline" slot="end"></ion-icon>
        </ion-button>
      </form>
      <ion-button expand="block" class="ion-margin-top" color="danger" class="ion-margin-top" (click)="registrar()">
        Registrarse<ion-icon name="person-circle-outline" slot="end"></ion-icon>
      </ion-button>

    </ion-card-content>
    <ion-card>
    <ion-card-header>
      <ion-card-title class="ion-text-center">Acceso Rápido</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-select id="select-id" placeholder="Selecciona usuario" interface="action-sheet" (ionChange)="fastFill($event.detail.value)">
          <ion-select-option value="dueño">Dueño</ion-select-option>
          <ion-select-option value="supervisor">Supervisor</ion-select-option>
          <ion-select-option value="maitre">Maitre</ion-select-option>
          <ion-select-option value="mozo">Mozo</ion-select-option>
          <ion-select-option value="cocinero">Cocinero</ion-select-option>
          <ion-select-option value="bartender">Bartender</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-card-content>
  </ion-card>
  </ion-card>

  


</ion-content>
