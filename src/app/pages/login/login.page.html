<ion-header [translucent]="true">
  <ion-toolbar class="ion-text-center">
    <img src="assets/icon/icon-only.png" alt="Logo" width="80">
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-justify-content-center ion-align-items-center">


  <ion-card>
    <ion-card-header>
      <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-padding">

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        
          <!-- Quizá queda mejor y con un estilo mas apegado a movil con el outline y floating
              pero si lo ven medio medio borren el tag de comentario y los "label / fill" de input 
          -->
          <ion-input type="email" formControlName="email" label="Correo Electrónico" fill="outline" labelPlacement="floating" class="ion-margin-top"/>
        
          <ion-input type="password" formControlName="password" label="Contraseña" fill="outline" labelPlacement="floating" class="ion-margin-top"/>
        
        <ion-button expand="block" type="submit" class="ion-margin-top">
          Iniciar sesión <ion-icon name="log-in-outline" slot="end"></ion-icon>
        </ion-button>
      </form>

    </ion-card-content>
    <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Acceso Rápido</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none" color="light">
        <ion-select placeholder="Selecciona usuario" interface="action-sheet" (ionChange)="fastFill($event.detail.value)">
          <ion-select-option value="dueño">Dueño</ion-select-option>
          <ion-select-option value="supervisor">Supervisor</ion-select-option>
          <ion-select-option value="maitre">Maitre</ion-select-option>
          <ion-select-option value="mozo">Mozo</ion-select-option>
          <ion-select-option value="cocinero">Cocinero</ion-select-option>
          <ion-select-option value="bartender">Bartender</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-card-content>
  </ion-card>
  </ion-card>

  


</ion-content>
