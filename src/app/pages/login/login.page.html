<ion-header [translucent]="true">
  <ion-toolbar class="ion-text-center custom-header">
    <div slot="start" class="header-spacer"></div>
 
    <ion-title class="toolbar-logo-title">
      <img src="assets/icon/icon-only.png" alt="Logo" width="85" />
    </ion-title>
 
    <!-- Botón Acceso Rápido esquina superior derecha -->
    <div slot="end" class="quick-access-btn-wrapper">
      <ion-button fill="clear" class="quick-access-trigger" (click)="toggleQuickAccess()">
        <ion-icon name="people-circle-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>
 
<!-- Backdrop -->
<div class="quick-access-backdrop" [class.visible]="quickAccessOpen" (click)="closeQuickAccess()"></div>
 
<!-- Panel estilo Google Accounts -->
<div class="quick-access-panel" [class.open]="quickAccessOpen">
  <div class="quick-access-header">
    <span class="quick-access-title">Acceso Rápido</span>
    <ion-button fill="clear" class="close-btn" (click)="closeQuickAccess()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>
  <div class="quick-access-list">
    <button class="qa-item" (click)="fastFill('dueño'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--dueno">D</div>
      <div class="qa-info">
        <span class="qa-name">Dueño</span>
        <span class="qa-email">dueno@resto-admin.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('supervisor'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--supervisor">S</div>
      <div class="qa-info">
        <span class="qa-name">Supervisor</span>
        <span class="qa-email">supervisor@resto-admin.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('maitre'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--maitre">M</div>
      <div class="qa-info">
        <span class="qa-name">Maître</span>
        <span class="qa-email">maitre@resto-empleado.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('mozo'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--mozo">Mz</div>
      <div class="qa-info">
        <span class="qa-name">Mozo</span>
        <span class="qa-email">mozo@resto-empleado.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('delivery'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--delivery">Dv</div>
      <div class="qa-info">
        <span class="qa-name">Delivery</span>
        <span class="qa-email">delivery@resto-empleado.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('cocinero'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--cocinero">C</div>
      <div class="qa-info">
        <span class="qa-name">Cocinero</span>
        <span class="qa-email">cocinero@resto-empleado.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('bartender'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--bartender">B</div>
      <div class="qa-info">
        <span class="qa-name">Bartender</span>
        <span class="qa-email">bartender@resto-empleado.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
    <button class="qa-item" (click)="fastFill('cliente'); closeQuickAccess()">
      <div class="qa-avatar qa-avatar--cliente">Cl</div>
      <div class="qa-info">
        <span class="qa-name">Cliente</span>
        <span class="qa-email">juanjo@mail.com</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="qa-arrow"></ion-icon>
    </button>
  </div>
</div>
 
<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <ion-card class="card-container">
      <ion-card-content class="ion-padding">
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <ion-input
            type="email"
            formControlName="email"
            label="Correo Electrónico"
            fill="outline"
            labelPlacement="floating"
            class="ion-margin-top"
          />
 
          <div class="password-container">
            <ion-input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              label="Contraseña"
              fill="outline"
              labelPlacement="floating"
              class="ion-margin-top password-input"
            ></ion-input>
            <ion-button
              fill="clear"
              (click)="cambiarVisibilidadPassword()"
              class="password-toggle"
            >
              <ion-icon [name]="passwordVisible ? 'eye' : 'eye-off'"></ion-icon>
            </ion-button>
          </div>
 
          <ion-button
            expand="block"
            type="submit"
            class="btn-primary ion-margin-top"
          >
            Iniciar sesión
            <ion-icon name="log-in-outline" slot="end"></ion-icon>
          </ion-button>
        </form>
        <ion-button
          expand="block"
          class="ion-margin-top"
          color="danger"
          (click)="registrar()"
        >
          Registrarse<ion-icon
            name="person-circle-outline"
            slot="end"
          ></ion-icon>
        </ion-button>
 
        <ion-button
          expand="block"
          fill="outline"
          color="secondary"
          (click)="irClienteAnonimo()"
        >
          Ingresar como Anónimo
        </ion-button>
 
        <div class="ion-text-center ion-margin-vertical">
          <ion-text color="medium">
            <p>Inicia sesión con:</p>
          </ion-text>
        </div>
 
        <!-- Botón de Google OAuth -->
        <ion-button
          expand="block"
          fill="outline"
          color="danger"
          (click)="loginConGoogle()"
          class="ion-margin-top"
        >
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Google
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
