<ion-header>
  <ion-toolbar color="primary">
    <ion-title>🏠 Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container-bienvenida">
    <h1>¡Bienvenido/a de vuelta 🎉!</h1>
    <h2 *ngIf="email">Ingresaste con <strong>{{ email }}</strong></h2>
  </div>

  <div class="container-cerrar-sesion">
    <ion-button expand="block" (click)="logout()" color="danger">
      Cerrar sesión
    </ion-button>
  </div>
</ion-content>
