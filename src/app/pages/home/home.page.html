<ion-header>
  <ion-toolbar color="primary">
    <ion-title>🏠 Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container-bienvenida">
    <h1>¡Bienvenido/a de vuelta!</h1>
    <h2 *ngIf="email">Ingresaste con <strong>{{ email }}</strong></h2>
  </div>

  <!-- Mostrar solo si es dueño o supervisor -->
  <ion-card *ngIf="perfil === 'dueño' || perfil === 'supervisor'">
    <ion-card-header>
      <ion-card-title>Empleados</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-button expand="block" color="secondary" (click)="agregarEmpleado()">
        + Agregar empleado
      </ion-button>
    </ion-card-content>

    <ion-card-header>
      <ion-card-title>Mesas</ion-card-title>
        <ion-card-content>
          <ion-button expand="block" color="secondary" (click)="agregarMesa()">
            + Agregar mesa
          </ion-button>
        </ion-card-content>
    </ion-card-header>

    <ion-card-header>
      <ion-card-title>Clientes</ion-card-title>
        <ion-card-content>
          <ion-button expand="block" color="secondary" (click)="adminCliente()">
            Administrar clientes
          </ion-button>
        </ion-card-content>
    </ion-card-header>

  </ion-card>

  <div class="container-cerrar-sesion">
    <ion-button expand="block" (click)="logout()" color="danger">
      Cerrar sesión
    </ion-button>
  </div>
</ion-content>
