<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button class="btn-volver" (click)="volver()" fill="clear" shape="round" slot="end">
      Volver
      <ion-icon slot="start" name="home-outline"></ion-icon>
    </ion-button>
    <ion-title>{{direccionDestino.split(',')[0]}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">maps</ion-title>
    </ion-toolbar>
  </ion-header>


  <google-map 
  height="100%" 
  width="100%" 
  [center]="mapCenter" 
  [zoom]="mapZoom"
  [options]="mapOptions">
  
    <map-directions-renderer 
      *ngIf="directionsResults$ | async as results" 
      [directions]="results"
      [options]="direccionRendererOptions">
    </map-directions-renderer>  

    <map-marker
    [position]="currentPosition"
    [options]="userMarkerOptions"
    ></map-marker>

    <map-marker
    [position]="direccionDestinoCoords"
    ></map-marker>

  </google-map>

</ion-content>
