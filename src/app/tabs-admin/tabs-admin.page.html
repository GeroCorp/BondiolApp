<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Esta dentro de la seccion administrador</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1-carga-empleado"> 
      <ion-icon name="people"></ion-icon>
      <ion-label>Empleados</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="tab2-carga-mesas">
      <ion-icon name="restaurant"></ion-icon>
      <ion-label>Mesas</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="tab4-admin-mesa">
      <ion-icon name="list"></ion-icon>
      <ion-label>Listado</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="tab3-admin-cliente">
      <ion-icon name="person-add"></ion-icon>
      <ion-label>Clientes</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="tab5-admin-perfil">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
