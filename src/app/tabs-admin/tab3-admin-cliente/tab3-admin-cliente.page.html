<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Admin-Clientes Pendientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="no-scroll-padding">
  <h2 class="ion-text-center">Listado de Clientes Pendientes</h2>

  <ion-list *ngIf="clientes.length > 0; else noHay">
    <ion-item *ngFor="let cliente of clientes" class="cliente-item">

      <ion-avatar slot="start">
        <img [src]="cliente.foto || 'assets/avatar-placeholder.png'" />
      </ion-avatar>

      <ion-label class="cliente-label">
        <h3>{{ cliente.apellido }}, {{ cliente.nombre }}</h3>
        <p>{{ cliente.email || 'sin email' }}</p>
        <small>Registrado: {{ cliente.created_at | date:'short' }}</small>
      </ion-label>

      <!-- contenedor fijo para los botones -->
      <div class="acciones" slot="end">
        <ion-button 
          color="success" 
          size="small" 
          fill="solid" 
          (click)="aprobarCliente(cliente)">
          Aceptar
        </ion-button>

        <ion-button 
          color="danger" 
          size="small" 
          fill="solid" 
          (click)="rechazarCliente(cliente)">
          Rechazar
        </ion-button>
      </div>
    </ion-item>
  </ion-list>

  <ng-template #noHay>
    <div class="sin-clientes">
      <ion-icon name="people-outline" size="large"></ion-icon>
      <p>No hay clientes pendientes.</p>
    </div>
  </ng-template>
</ion-content>
