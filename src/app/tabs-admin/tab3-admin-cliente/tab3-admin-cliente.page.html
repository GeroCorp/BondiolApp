<ion-content [fullscreen]="true" class="cliente-content">
  <h2 class="cliente-title ion-text-center">Listado de Clientes Pendientes</h2>
  <ion-list *ngIf="clientes.length > 0; else noHay">
    
    <div *ngFor="let cliente of clientes" class="cliente-item">
      
      <ion-avatar class="cliente-avatar">
        <img [src]="cliente.foto || 'assets/avatar-placeholder.png'" />
      </ion-avatar>

      <div class="cliente-label">
        <h3>{{ cliente.apellido }}, {{ cliente.nombre }}</h3>
        <p>{{ cliente.email || 'sin email' }}</p>
        <small>Registrado: {{ cliente.created_at | date:'short' }}</small>
      </div>

      <div class="acciones">
        <ion-button color="success" expand="block" (click)="aprobarCliente(cliente)">Aceptar</ion-button>
        <ion-button color="danger" expand="block" (click)="rechazarCliente(cliente)">Rechazar</ion-button>
      </div>

    </div>
  </ion-list>

  <ng-template #noHay>
    <div class="sin-clientes">
      <ion-icon name="people-outline" size="large"></ion-icon>
      <p>No hay clientes pendientes.</p>
    </div>
  </ng-template>
</ion-content>
