<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" icon="arrow-back"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="bicycle-outline"></ion-icon>
      Gestion Delivery
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestion Delivery</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="wrapper">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Pedidos para Delivery</ion-card-title>
      </ion-card-header>
      <ion-card-content class="ion-padding">
        <p class="ion-padding-top">Aquí puedes gestionar los pedidos de delivery realizados por los clientes.</p>
        
          <ion-button expand="block" color="secondary" class="ion-padding"
          (click)="pedidosPendientes()">
            Pedidos pendientes
          </ion-button>
        
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
