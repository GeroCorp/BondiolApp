<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Estado de pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Estado de pedidos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card color="dark">
    <ion-card-header>
      <ion-card-title>Estado de Pedidos de Delivery</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-padding">
      <p class="ion-padding-top">Aquí puedes ver el estado de los pedidos de delivery realizados por los clientes.</p>
    </ion-card-content>
  </ion-card>

  <ion-card color="dark">
    <ion-card-header>
      <ion-card-title>Filtrar Pedidos por Estado</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-padding">
      <ion-item>
        <ion-label>Selecciona el estado:</ion-label>
        <ion-select placeholder="Elige un estado">
          <ion-select-option value="pendiente">Pendiente</ion-select-option>
          <ion-select-option value="en_preparacion">En Preparación</ion-select-option>
          <ion-select-option value="en_camino">En Camino</ion-select-option>
          <ion-select-option value="entregado">Entregado</ion-select-option>
          <ion-select-option value="cancelado">Cancelado</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-button expand="block" class="ion-margin-top" >
        Filtrar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card color="dark">
    <!-- @for (pedidos of pedidosFiltrados; track $index){

    } -->
  </ion-card>
</ion-content>
