<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>tab2-cargaMesas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"></ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card class="ion-padding">
  
    <form [formGroup]="mesaForm" (ngSubmit)="onSubmit()">
      <ion-item lines="none">
        <ion-label position="floating">Número de mesa</ion-label>
        <ion-input formControlName="numero" type="number" fill="outline"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="floating">Capacidad</ion-label>
        <ion-input formControlName="capacidad" type="number" fill="outline"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="fixed">Tipo de Mesa</ion-label>  
      </ion-item>

      <ion-item lines="none">
        <ion-select formControlName="tipo" interface="action-sheet" placeholder="Seleccionar Tipo">
          <ion-select-option value="VIP">VIP</ion-select-option>
          <ion-select-option value="estandar">Estandar</ion-select-option>
          <ion-select-option value="movilidad reducida">Movilidad reducida</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="floating">URL del QR</ion-label>
        <ion-input type="text" readonly="true"></ion-input>
      </ion-item>

      <ion-button (click)="generateQR()" expand="block" fill="clear" shape="round">
        Generar QR
      </ion-button>
      
      
        <div *ngIf="qrData" class="ion-text-center ion-margin-top">
          <qrcode [qrdata]="qrData"  [elementType]="'canvas'" (qrCodeURL)="onQrCodeUrl($event)" [width]="200" [errorCorrectionLevel]="'M'"></qrcode>
          
          <!-- muestra el link para descargar imagen del qr -->
          <a [href]="qrCodeDownloadLink" download="qrcode">Descargar QR</a>
        </div>
      
      <ion-button class="ion-margin-top" expand="block" type="submit" [disabled]="mesaForm.invalid">Crear Mesa</ion-button>
    </form>
  </ion-card>
</ion-content>
