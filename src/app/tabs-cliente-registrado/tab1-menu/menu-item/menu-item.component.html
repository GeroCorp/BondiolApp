<div class="main-container">
  <ion-card class="ion-padding">
      <ion-button (click)="onClose()" >
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
      
    <ion-card-header>
      <div class="carrusel">
        @if (item?.imagenes && item.imagenes.length > 0) {
          <ion-img [src]="item.imagenes[currentImageIndex]"></ion-img>
          <div class="carrusel-controls">
            <button (click)="prevImage()" [disabled]="currentImageIndex === 0"><ion-icon name="caret-back-outline"></ion-icon></button>
            <button (click)="nextImage()" [disabled]="currentImageIndex === item.imagenes.length - 1"><ion-icon name="caret-forward-outline"></ion-icon></button>
          </div>
        } @else {
          <ion-img src="assets/placeholder.png"></ion-img>
        }
      </div>
    </ion-card-header>
    <div class="sub-header">
      <ion-card-title>{{ item?.nombre }}</ion-card-title>
      <ion-label>Precio: {{ item?.precio | currency:'$' }}</ion-label>
    </div>
    <ion-card-content>
      <p>{{ item?.descripcion }}</p>
    </ion-card-content>
    <div class="bottom">
      <small>Tiempo estimado {{ item?.tiempo }} min</small>
      <div class="quantity-container">
        <div class="quantity-controls">
          <ion-button fill="outline" size="small" (click)="decreaseQuantity()" [disabled]="quantity <= 1">
            <ion-icon name="remove-outline"></ion-icon>
          </ion-button>
          <span class="quantity-display">{{ quantity }}</span>
          <ion-button fill="outline" size="small" (click)="increaseQuantity()">
            <ion-icon name="add-outline"></ion-icon>
          </ion-button>
        </div>
        <ion-button (click)="onAddItem()" color="primary">
          <ion-icon slot="start" name="add"></ion-icon>
          Agregar ({{ (item?.precio * quantity) | currency:'$':'symbol':'1.0-0' }})
        </ion-button>
      </div>
    </div>

  </ion-card>
</div>
