<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Ingreso Anónimo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Foto</ion-label>
    <input type="file" (change)="subirFoto($event)" accept="image/*" />
  </ion-item>

  <ion-button expand="block" color="primary" (click)="registrarAnonimo()">
    Ingresar al local
  </ion-button>

</ion-content>
