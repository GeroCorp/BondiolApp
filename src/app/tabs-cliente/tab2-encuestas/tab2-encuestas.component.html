<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Encuestas Previas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let encuesta of encuestas">
      <ion-label>
        <h2>{{ encuesta.titulo }}</h2>
        <p>{{ encuesta.resultado }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
